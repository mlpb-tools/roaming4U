*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Arial,system-ui; background:#fff; color:var(--txt)}
/* Header */
.header{padding:10px 14px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header img{height:38px; width:auto; display:block}
.brand{display:flex;align-items:center;gap:10px}
.h-titles{display:flex;flex-direction:column}
.h-title{font-weight:900; font-size:16px; line-height:1.1}
.h-sub{font-size:12px;color:#555}
/* Layout */
.layout{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:12px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
/* TOC */
.toc{border:1px solid var(--bord);border-radius:10px;padding:10px;max-height:calc(100vh - 120px);overflow:auto}
.toc h3{margin:0 0 8px;font-size:14px;color:#374151}
.toc a{display:block;padding:8px 10px;margin:4px 0;border-radius:8px;text-decoration:none;color:#111827;font-size:13px;border:1px solid transparent}
.toc a:hover{background:var(--gris)}
.toc a.active{background:#eaf4fc;border-color:#cfe8fb}
/* Main */
.main{border:1px solid var(--bord);border-radius:10px;padding:14px}
h1{margin:4px 0 8px;font-size:20px}
.obj{background:var(--gris);padding:10px;border-radius:8px;margin:8px 0}
.small{font-size:12px;color:#555}
.block{margin:12px 0;padding:10px;border:1px solid var(--bord);border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,textarea,button,input{font:inherit}
textarea{width:100%;min-height:100px;margin-top:6px}
.btn{background:var(--bleu);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.secondary{background:var(--vert)} .btn.ghost{background:#fff;color:#111;border:1px solid var(--bord)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.kv{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#f8fafc;border:1px solid var(--bord);font-size:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
/* Chips phase */
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:6px}
.ch-id{background:#eaf4fc;color:#0b6fbf;border:1px solid #cfe8fb}
.ch-me{background:#e9f7ee;color:#1c7c35;border:1px solid #cbeed8}
.ch-mo{background:#fff0e0;color:#9a5700;border:1px solid #ffd7a8}

const TOTAL = PAGES.length;

/* ====== Stockage simple (localStorage) ====== */
let records = JSON.parse(localStorage.getItem('ls_records')||'[]');
function save(pageId, patch){
  const i = records.findIndex(r=>r.id===pageId);
  const base = i>=0 ? records[i] : {id:pageId, eval:[], notes:'', done:false, pts:0, badge:''};
  const rec = Object.assign({}, base, patch);
  if(i>=0) records[i]=rec; else records.push(rec);
  localStorage.setItem('ls_records', JSON.stringify(records));
  updateStats();
}
function stat(){
  const pts = records.reduce((s,r)=>s+(r.pts||0),0);
  const done = records.filter(r=>r.done).length;
  const badges = new Set(records.map(r=>r.badge).filter(Boolean)).size;
  return {pts,done,badges};
}
function updateStats(){
  const s = stat();
  document.getElementById('statDone').textContent = s.done;
  document.getElementById('statTotal').textContent = TOTAL;
  document.getElementById('statPoints').textContent = s.pts;
  document.getElementById('statBadges').textContent = s.badges;
}

/* ============== Sommaire ============== */
function buildTOC(){
  const el = document.getElementById('toc');
  el.innerHTML = PAGES
    .sort((a,b)=>idSort(a.id,b.id))
    .map(p=>`<a href="#/${p.id}" data-id="${p.id}">${p.id} – ${p.titre}</a>`)
    .join('');
}

/* ============== Routing ============== */
function route(){
  const id = location.hash.replace('#/','') || '1-1-1';
  render(id);
}
function idSort(a,b){
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  for(let i=0;i<3;i++){ if(pa[i]!==pb[i]) return pa[i]-pb[i]; }
  return 0;
}
function ids(){ return PAGES.map(p=>p.id).sort(idSort); }
function prevId(id){ const arr=ids(); const i=arr.indexOf(id); return arr[Math.max(0,i-1)]||id; }
function nextId(id){ const arr=ids(); const i=arr.indexOf(id); return arr[Math.min(arr.length-1,i+1)]||id; }

/* ============== Rendu page ============== */
function chip(phase){
  if(phase==='id') return '<span class="chip ch-id">Phase 1 – Identifier</span>';
  if(phase==='me') return '<span class="chip ch-me">Phase 2 – Mesurer</span>';
  return '<span class="chip ch-mo">Phase 3 – Mettre en œuvre</span>';
}
function render(id){
  const p = PAGES.find(x=>x.id===id); if(!p) return;
  document.querySelectorAll('.toc a').forEach(a=>a.classList.toggle('active', a.getAttribute('data-id')===id));
  const rec = records.find(r=>r.id===id) || {eval:[],notes:'',done:false,pts:0,badge:''};
  const evalOpts = ['1 – Débutant','2 – En progrès','3 – Confirmé','4 – Expérimenté'];
  const evalUI = p.eval.map((q,i)=>`
    <div class="row">
      <div style="flex:1">${q}</div>
      <select data-idx="${i}">
        ${evalOpts.map((o,lv)=>`<option value="${lv+1}" ${(rec.eval||[])[i]==(lv+1)?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`).join('');
  const steps = p.act.etapes.map((s,i)=>`<li>${i+1}. ${s}</li>`).join('');

  document.getElementById('main').innerHTML = `
    <h1>${p.titre} ${chip(p.phase)}</h1>
    <div class="obj">🎯 <strong>Objectif :</strong> ${p.objectif}</div>
    <div class="small">ID: ${p.id}</div>

    <div class="block"><strong>💡 Intro</strong><div>${p.intro}</div></div>

    <div class="block">
      <strong>📊 Auto-évaluation</strong>
      ${evalUI}
      <div style="margin-top:8px">
        <button class="btn" onclick="saveEval('${p.id}')">Sauvegarder</button>
      </div>
    </div>

    <div class="block">
      <strong>📝 Activité LS4YOU</strong>
      <div><em>${p.act.nom}</em> – ${p.act.resume}</div>
      <ol style="margin-top:6px">${steps}</ol>
      <div class="small" style="margin-top:6px">${p.act.ancrage} — ${p.act.source}</div>
    </div>

    <div class="block">
      <strong>🎮 Mini-activité</strong>
      <div>Points: <strong>${p.game.points}</strong> • Badge: <strong>${p.game.badge}</strong></div>
      <div style="margin-top:6px">
        <button class="btn secondary" onclick="complete('${p.id}', ${p.game.points}, '${p.game.badge}')">Marquer comme fait</button>
        <button class="btn ghost" onclick="uncomplete('${p.id}')">Annuler</button>
      </div>
      <div class="small" style="margin-top:6px">Astuce : réalise l’activité sur Canva/diapo puis clique “Marquer comme fait”.</div>
    </div>

    <div class="block">
      <strong>💾 Ma trace</strong>
      <textarea id="tx" placeholder="Note ici ce que tu as appris, tes réflexions, tes questions…"></textarea>
      <div style="margin-top:6px">
        <button class="btn" onclick="saveNotes('${p.id}')">Sauvegarder mes notes</button>
      </div>
    </div>

    <div class="nav">
      <a class="btn" href="#/${prevId(p.id)}">← Précédent</a>
      <a class="btn" href="#/${nextId(p.id)}">Suivant →</a>
    </div>
  `;
  document.getElementById('tx').value = rec.notes || '';
  updateStats();
}

/* ============== Actions ============== */
function saveEval(id){
  const vals = [...document.querySelectorAll('select[data-idx]')].map(s=>parseInt(s.value)||1);
  save(id, {eval: vals});
}
function saveNotes(id){
  const v = document.getElementById('tx').value || '';
  save(id, {notes: v});
}
function complete(id, pts, badge){
  save(id, {done:true, pts:pts, badge:badge});
}
function uncomplete(id){
  save(id, {done:false, pts:0, badge:''});
}

/* ============== Init ============== */
document.addEventListener('DOMContentLoaded', ()=>{
  buildTOC(); updateStats(); route();
});
window.addEventListener('hashchange', route);
</script>
